<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battleship - Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo-container">
                <a href="https://github.com/EvilLeeovo" target="_blank" class="logo-link">
                    <img src="images/bear.png" alt="Battleship Logo" class="logo">
                    <h1>Battleship</h1>
                </a>
            </div>
            <ul>
                <li><a href="index.html" class="active">
                    <img src="icons/home.svg" alt="Home Icon" class="nav-icon"> Home
                </a></li>
                <li><a href="game.html">
                    <img src="icons/game.svg" alt="Game Icon" class="nav-icon"> Game
                </a></li>
                <li><a href="rules.html">
                    <img src="icons/rules.svg" alt="Rules Icon" class="nav-icon"> Rules
                </a></li>
                <li><a href="highscores.html">
                    <img src="icons/highscores.svg" alt="High Scores Icon" class="nav-icon"> High Scores
                </a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section class="main-content">
            <div class="intro">
                <h2>Welcome to <span class="highlight">Battleship</span></h2>
                <img src="images/battleship.jpg" alt="Battleship Image" class="main-image">
            </div>
            <div class="actions">
                <button class="start-button" onclick="location.href='game.html'">Start Game</button>
            </div>
        </section>
    </main>
    <footer>
        <p>2025 Battleship Evilleeovo</p>
    </footer>

</html>
