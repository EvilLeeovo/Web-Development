<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Battleship - High Scores</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo-container">
                <a href="https://github.com/EvilLeeovo" target="_blank" class="logo-link">
                    <img src="images/bear.png" alt="Battleship Logo" class="logo">
                    <h1>Battleship</h1>
                </a>
            </div>
            <div class="header-image">
                <img src="images/1.png" alt="Header Image">
            </div>
            <div class="header-image">
                <img src="images/4.png" alt="Header Image">

            <ul>
                <li><a href="index.html">
                    <img src="icons/home.svg" alt="Home Icon" class="nav-icon"> Home
                </a></li>
                <li><a href="game.html">
                    <img src="icons/game.svg" alt="Game Icon" class="nav-icon"> Game
                </a></li>
                <li><a href="rules.html">
                    <img src="icons/rules.svg" alt="Rules Icon" class="nav-icon"> Rules

                <li><a href="highscores.html" class="active">

            </ul>
        </nav>
    </header>
    <main>
        <section class="highscores-container">

            <table>

                    <tr>

                        <th>Games Lost</th>

                <tbody>
                    <tr>
                        <td>Player1</td>
                        <td>15</td>

                    <tr>
                        <td>Player2</td>

                    </tr>
                    <tr>
                        <td>Player3</td>
                        <td>20</td>
                        <td>2</td>
                        <td>22</td>
                        <td>15</td>
                    </tr>
                    <tr>
                        <td>Player4</td>
                        <td>8</td>
                        <td>12</td>
                        <td>20</td>
                        <td>25</td>
                    </tr>
                    <tr>
                        <td>Player5</td>

                        <td>9</td>
                        <td>21</td>
                        <td>19</td>
                    </tr>
                </tbody>
            </table>

    </main>    
    <footer>
        <div class="footer-images">
            <img src="images/2.png" alt="Footer Left Image">
            <p>2025 Battleship Evilleeovo</p>
            <img src="images/3.png" alt="Footer Right Image">

    </footer>

</html>
